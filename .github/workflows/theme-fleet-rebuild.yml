# Edit and push from _ttms_menu_demo/themes/_menus_ttms (this submodule).
# That push is anomrac21/_menus_ttms — one dispatch, no per-client submodule commits.
name: Theme fleet rebuild

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      client_name:
        description: 'Optional single cluster client id (empty = all Hugo clients)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: theme-fleet-rebuild
  cancel-in-progress: true

jobs:
  trigger-theme-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy token
        env:
          HUGO_DEPLOY_TOKEN: ${{ secrets.HUGO_DEPLOY_TOKEN }}
          CLUSTER_REPO_TOKEN: ${{ secrets.CLUSTER_REPO_TOKEN }}
        run: |
          if [ -z "$HUGO_DEPLOY_TOKEN" ] && [ -z "$CLUSTER_REPO_TOKEN" ]; then
            echo "::error::Missing HUGO_DEPLOY_TOKEN (or CLUSTER_REPO_TOKEN)."
            echo "Needed to repository_dispatch hugo-theme-rebuild on ttms-client-configs."
            echo "Inject it with ttms-app-cluster workflow hugo-deploy-token-inject.yml"
            echo "(client_slug=_menus_ttms or include_theme_repos=true)."
            exit 1
          fi

      - name: Kick cluster theme fleet rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HUGO_DEPLOY_TOKEN || secrets.CLUSTER_REPO_TOKEN }}
          repository: anomrac21/ttms-client-configs
          event-type: hugo-theme-rebuild
          client-payload: |-
            {
              "theme_ref": "${{ github.sha }}",
              "cluster_client_id": "${{ github.event.inputs.client_name }}",
              "environment": "production",
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}"
            }
