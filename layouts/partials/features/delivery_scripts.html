{{- $ds := site.Params.deliveryService | default dict -}}
{{- $deliveryEnabled := and (default false site.Params.features.delivery) (default false $ds.enabled) -}}
{{- if $deliveryEnabled -}}
{{- $loc := site.Params.location | default dict -}}
<link rel="stylesheet" href="{{ partial "head/asset-url.html" "/css/delivery.css" }}">
<script>
window.DELIVERY_CONFIG = {
  enabled: true,
  apiUrl: {{ ($ds.apiUrl | default "https://delivery.ttmenus.com/api/v1") | jsonify | safeJS }},
  wsUrl: {{ ($ds.wsUrl | default "wss://delivery.ttmenus.com/api/v1") | jsonify | safeJS }},
  clientId: {{ (site.Params.contentManagement.clientId | default site.Params.ads.clientId | default "") | jsonify | safeJS }},
  clientDomain: {{ (site.Params.notifications.clientDomain | default "") | jsonify | safeJS }},
  restaurantName: {{ site.Title | jsonify | safeJS }},
  restaurantLat: {{ default 0 $loc.lat }},
  restaurantLng: {{ default 0 $loc.lng }},
  currency: {{ ($ds.currency | default site.Params.paymentService.currency | default "TTD") | jsonify | safeJS }},
  deliveryFee: {{ default 30 $ds.deliveryFee }}
};
(function (cfg) {
  if (!cfg) return;
  function unwrap(value) {
    if (typeof value !== 'string') return value;
    var s = value.trim();
    while (s.length >= 2 && ((s.charAt(0) === '"' && s.charAt(s.length - 1) === '"') || (s.charAt(0) === "'" && s.charAt(s.length - 1) === "'"))) {
      try { s = JSON.parse(s); } catch (e) { s = s.slice(1, -1); }
      if (typeof s !== 'string') return s;
      s = s.trim();
    }
    return s;
  }
  cfg.apiUrl = unwrap(cfg.apiUrl);
  cfg.wsUrl = unwrap(cfg.wsUrl);
  cfg.clientId = unwrap(cfg.clientId);
  cfg.clientDomain = unwrap(cfg.clientDomain);
  cfg.restaurantName = unwrap(cfg.restaurantName);
  cfg.currency = unwrap(cfg.currency);
})(window.DELIVERY_CONFIG);
</script>
<script src="{{ partial "head/asset-url.html" "/js/delivery-client.js" }}" defer></script>
<script src="{{ partial "head/asset-url.html" "/js/delivery-ui.js" }}" defer></script>
{{- end -}}
