<div id="dashboard" class="loader-hide-left dashboard-panel" aria-hidden="true">
	<div class="dashboard-panel-motion">
	<div class="dashboard-panel-header header dashboard-header-bar">
		<a href="https://www.ttmenus.com" class="dashboard-header-brand" onclick="if (typeof closeAll === 'function') closeAll();" aria-label="TT Menus: home">
			<span class="dashboard-header-brand__mark" aria-hidden="true">
				<img class="dashboard-header-logo dashboard-header-logo--gif" src="https://cdn.ttmenus.com/branding/ttmenus/ttmenu.gif" alt="">
			</span>
			<img class="dashboard-header-logo dashboard-header-logo--wordmark" src="https://cdn.ttmenus.com/branding/ttmenus/ttmenus.webp" alt="TT Menus">
		</a>
		<div class="dashboard-header-trailing">
			{{ partialCached "ttms-account-dashboard/panel-button.html" . }}
			<a href="/dashboard/" class="dashboard-header-admin-link ttms-icon-btn" data-auth="admin-site" style="display: none;" title="Menu dashboard" aria-label="Menu dashboard" data-barba="prevent" onclick="if (typeof closeAll === 'function') closeAll();">
				<i class="fa fa-th-large" aria-hidden="true"></i>
			</a>
			<button type="button" class="dashboard-header-close ttms-icon-btn ttms-icon-btn--on-dark" onclick="closeDashboard(); return false;" aria-label="Close menu panel">
				<img class="dashboard-header-close-img" src="https://cdn.ttmenus.com/icons/ui/close.svg" alt="" width="24" height="24" decoding="async">
			</button>
		</div>
	</div>

		<div class="dashboard-panel-scroll">
		<div class="dashboard-panel-empty" id="dashboard-panel-empty">
			<div class="dashboard-panel-empty__icon-wrap" aria-hidden="true">
				<img class="dashboard-panel-empty__logo" src="https://cdn.ttmenus.com/branding/ttmenus/ttmenu.gif" alt="TT Menus">
			</div>
			<p class="dashboard-panel-empty__title" id="dashboard-panel-empty-title">Powered by TT Menus</p>
			<p class="dashboard-panel-empty__hint" id="dashboard-panel-empty-hint">Digital menus for restaurants and bars across Trinidad &amp; Tobago.</p>
		</div>
	</div>

	<div class="dashboardfooter dashboard-panel-footer">
		<nav class="dashboard-panel-footer__nav" aria-label="TT Menus links">
			<div class="dashboard-panel-footer__row">
				<a href="https://ttmenus.com/about-us">
					<span class="dashboard-panel-footer__glyph" aria-hidden="true">
						<svg class="dashboard-panel-footer__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12.5a3.75 3.75 0 1 0-3.75-3.75A3.75 3.75 0 0 0 12 12.5Zm-7 8.25c.46-2.86 3.1-5 7-5s6.54 2.14 7 5a1 1 0 0 1-1 1.25H6a1 1 0 0 1-1-1.25Z"/></svg>
					</span>
					<span>About</span>
				</a>
				<a href="https://ttmenus.com/contact-us">

						<svg class="dashboard-panel-footer__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm-.4 3.25-7.05 4.7a1 1 0 0 1-1.1 0L4.4 7.25A.75.75 0 0 1 5.25 6h13.5a.75.75 0 0 1 .85 1.25Z"/></svg>
					</span>
					<span>Contact</span>
				</a>
				<a href="https://ttmenus.com/our-services">
					<span class="dashboard-panel-footer__glyph" aria-hidden="true">
						<svg class="dashboard-panel-footer__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M4 3.75h6.5v6.5H4v-6.5Zm9.5 0H20v6.5h-6.5v-6.5ZM4 13.75h6.5V20H4v-6.25Zm9.5 0H20V20h-6.5v-6.25Z"/></svg>
					</span>
					<span>Services</span>
				</a>
				<a href="https://ttmenus.com/privacy-policy">
					<span class="dashboard-panel-footer__glyph" aria-hidden="true">
						<svg class="dashboard-panel-footer__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17 9h-1.1V7.1A3.9 3.9 0 0 0 12 3.2a3.9 3.9 0 0 0-3.9 3.9V9H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7.15-1.9A2.15 2.15 0 0 1 12 5v0a2.15 2.15 0 0 1 2.15 2.1V9H9.85V7.1ZM12 17.15A1.35 1.35 0 1 1 13.35 15.8 1.35 1.35 0 0 1 12 17.15Z"/></svg>
					</span>
					<span>Privacy</span>
				</a>
				<a href="https://ttmenus.com/terms-and-conditions">
					<span class="dashboard-panel-footer__glyph" aria-hidden="true">
						<svg class="dashboard-panel-footer__icon" viewBox="0 0 24 24"><path fill="currentColor" d="M14.2 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.8L14.2 2Zm.3 2.7 3.1 3.1h-3.1V4.7ZM8.5 12.2h7v1.5h-7v-1.5Zm0 3.3h7v1.5h-7V15.5Z"/></svg>
					</span>

				</a>
			</div>
		</nav>
	</div>
	</div>
</div>
