{{- /* Site copy first so theme updates apply. CDN script is the fallback. Icons still come from the CDN API. */ -}}
{{- $pickerSrc := partial "head/asset-url.html" "/js/dashboard-section-icon-picker.js" -}}
{{- if eq hugo.Environment "development" -}}
<script src="{{ $pickerSrc }}"></script>
{{- else -}}
<script>
(function (global) {
  var sources = [
    {{ $pickerSrc | jsonify | safeJS }},
    'https://cdn.ttmenus.com/js/dashboard-section-icon-picker.js'
  ];
  var idx = 0;
  function startPicker() {
    if (global.DashboardSectionIconPicker) return;
    if (idx >= sources.length) {
      global.dispatchEvent(new CustomEvent('ttmenus-icon-picker-load-failed'));
      return;
    }
    var s = document.createElement('script');
    s.src = sources[idx++];
    s.onload = function () {
      if (!global.DashboardSectionIconPicker) startPicker();
    };
    s.onerror = startPicker;
    document.head.appendChild(s);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startPicker);
  } else {
    startPicker();
  }
})(window);
</script>
{{- end -}}
