<div class="dashboard-theme-toggle" role="group" aria-label="Dashboard theme">
  <button type="button" id="night-mode" class="dashboard-theme-btn" onclick="toggleTheme('dark'); return false;" title="Dark mode" aria-label="Use dark theme">
    <i class="fa fa-moon-o" aria-hidden="true"></i>
  </button>
  <button type="button" id="light-mode" class="dashboard-theme-btn hide" onclick="toggleTheme('light'); return false;" title="Light mode" aria-label="Use light theme">
    <i class="fa fa-sun-o" aria-hidden="true"></i>
  </button>
</div>
