{{- if site.Params.auth.enabled -}}
<div
  id="menu-item-edit-modal"
  class="menu-item-edit-modal"
  hidden
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-labelledby="menu-item-edit-modal-title"
  data-auth="admin-site"
>
  <div class="menu-item-edit-modal__backdrop" data-close-menu-item-edit-modal tabindex="-1" aria-hidden="true"></div>
  <div class="menu-item-edit-modal__panel">
    <header class="menu-item-edit-modal__header">
      <div class="menu-item-edit-modal__title-wrap">
        <h2 id="menu-item-edit-modal-title" class="menu-item-edit-modal__title">Edit menu item</h2>
        <button
          type="button"
          class="menu-content-draft-badge menu-content-draft-badge--modal hidden"
          id="menuItemEditModalDraftBadge"
          title="Load unpublished CMS draft"
          aria-label="Load unpublished CMS draft"
          hidden
        >
          <i class="fa fa-exclamation-circle" aria-hidden="true"></i>
        </button>
      </div>
      <div class="menu-item-edit-modal__actions">
        <button
          type="button"
          class="menu-item-edit-modal__icon-btn menu-item-edit-modal__delete"
          id="menuItemEditModalDelete"
          aria-label="Mark for deletion"
          title="Mark for deletion"
          disabled
        >
          <i class="fa fa-trash" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          class="menu-item-edit-modal__icon-btn menu-item-edit-modal__save"
          id="menuItemEditModalSave"
          title="Save these changes. Customers see them after you publish."
          aria-label="Save changes"
        >
          <i class="fa fa-check" aria-hidden="true"></i>
          <span class="menu-item-edit-modal__save-label">Save</span>
          <span class="menu-item-edit-modal__save-count hidden" id="menuItemEditModalSaveCount" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="menu-item-edit-modal__icon-btn menu-item-edit-modal__close"
          data-close-menu-item-edit-modal
          aria-label="Close without saving"
          title="Close without saving"
        >
          <i class="fa fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <div class="menu-item-edit-modal__body">
      <div
        id="menuItemEditModalLoading"
        class="menu-item-edit-modal__loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        hidden
      >
        <div class="menu-item-edit-modal__loading-inner">
          <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
          <span class="menu-item-edit-modal__loading-label">Loading editor…</span>
        </div>
      </div>
      <iframe
        id="menuItemEditModalFrame"
        class="menu-item-edit-modal__frame"
        title="Menu content editor"
        src="about:blank"
        loading="lazy"
      ></iframe>
    </div>
    <div
      id="menuItemEditDiscardPrompt"
      class="menu-item-edit-discard-prompt hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="menuItemEditDiscardPromptTitle"
      aria-hidden="true"
      hidden
    >
      <div class="menu-item-edit-discard-prompt__backdrop" data-menu-item-edit-discard-cancel tabindex="-1" aria-hidden="true"></div>
      <div class="menu-item-edit-discard-prompt__dialog">
        <h3 id="menuItemEditDiscardPromptTitle" class="menu-item-edit-discard-prompt__title">Lose unsaved changes?</h3>
        <p class="menu-item-edit-discard-prompt__text">Closing discards what you have not saved. Press Save first if you want to keep these edits.</p>
        <div class="menu-item-edit-discard-prompt__actions">
          <button type="button" class="menu-item-edit-discard-prompt__btn menu-item-edit-discard-prompt__btn--keep" data-menu-item-edit-discard-cancel>Keep editing</button>
          <button type="button" class="menu-item-edit-discard-prompt__btn menu-item-edit-discard-prompt__btn--discard" id="menuItemEditDiscardConfirm">Discard</button>
        </div>
      </div>
    </div>
  </div>
</div>
{{- end -}}
